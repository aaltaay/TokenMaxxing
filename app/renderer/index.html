<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'">
<title>TOKENMAXXING</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

  <header class="titlebar">
    <div class="brand">
      <!-- A double up-chevron: the meter going up and over. Achromatic on
           purpose — the three provider hues own colour in this app, so the
           brand never competes with the data. -->
      <svg class="brand-mark" width="20" height="20" viewBox="0 0 20 20" fill="none"
           stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
           stroke-linejoin="round" aria-hidden="true">
        <path d="M4 10.5 10 4.5 16 10.5" opacity="0.55"/>
        <path d="M4 16 10 10 16 16"/>
      </svg>
      <div>
        <div class="brand-name"><span class="bm-soft">TOKENMA</span><span class="bm-xx">XX</span><span class="bm-soft">ING</span></div>
        <div class="brand-sub" id="brandSub">Connecting to the usage engine…</div>
      </div>
    </div>

    <div class="titlebar-actions">
      <button class="icon-btn" id="btnRefresh" title="Refresh usage" aria-label="Refresh usage">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/>
        </svg>
      </button>
      <button class="icon-btn" id="btnPin" title="Keep on top" aria-label="Keep on top" aria-pressed="true">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 17v5"/><path d="M9 10.8V4h6v6.8l2.6 3.4a1 1 0 0 1-.8 1.6H7.2a1 1 0 0 1-.8-1.6z"/>
        </svg>
      </button>
    </div>
  </header>

  <nav class="segmented" role="tablist" aria-label="Views">
    <span class="segmented-thumb" id="segThumb" aria-hidden="true"></span>
    <button role="tab" id="tab-overview" aria-controls="view-overview" aria-selected="true">Overview</button>
    <button role="tab" id="tab-chat" aria-controls="view-chat" aria-selected="false">This chat</button>
    <button role="tab" id="tab-resets" aria-controls="view-resets" aria-selected="false">Resets</button>
  </nav>

  <main class="views">

    <!-- ── Overview ──────────────────────────────────────────────────── -->
    <section class="view is-active" id="view-overview" role="tabpanel" aria-labelledby="tab-overview">

      <div class="card">
        <div class="card-head">
          <h2>Usage</h2>
          <span class="meta" id="cycleMeta">—</span>
        </div>
        <div class="hero">
          <div class="dial" id="dial">
            <svg viewBox="0 0 224 224" role="img" aria-labelledby="dialTitle">
              <title id="dialTitle">Consumption of each Cursor pool this billing cycle</title>
              <g id="dialRings"></g>
            </svg>
            <div class="dial-center">
              <div class="dial-value" id="dialValue">—</div>
              <div class="dial-label" id="dialLabel">included usage</div>
            </div>
          </div>
          <div class="legend" id="legend"></div>
        </div>
        <div class="pools" id="pools"></div>
      </div>

      <div class="attention" id="attention"></div>

      <div class="tiles" id="tiles"></div>

    </section>

    <!-- ── This chat ─────────────────────────────────────────────────── -->
    <section class="view" id="view-chat" role="tabpanel" aria-labelledby="tab-chat">

      <div class="card">
        <div class="card-head">
          <h2>Context window</h2>
          <span class="meta" id="chatModel">—</span>
        </div>
        <div class="chat-picker">
          <select class="select" id="chatSelect" aria-label="Chat to follow"></select>
          <button class="chip" id="btnUnpin">Follow active</button>
        </div>
        <div id="chatBody"></div>
      </div>

      <div class="card">
        <div class="card-head"><h2>Where the window goes</h2>
          <span class="meta" id="chatTax">—</span>
        </div>
        <div class="cat-rows" id="chatCats"></div>
      </div>

      <div class="card">
        <div class="card-head"><h2>Billed to this chat</h2>
          <span class="meta">this cycle</span>
        </div>
        <div id="chatBilled"></div>
      </div>

    </section>

    <!-- ── Resets ────────────────────────────────────────────────────── -->
    <section class="view" id="view-resets" role="tabpanel" aria-labelledby="tab-resets">
      <div class="card">
        <div class="card-head">
          <h2>Provider windows</h2>
          <span class="meta" id="resetsNow">—</span>
        </div>
        <p class="tile-note flush">
          Session and weekly windows for Claude and Codex. These are not Cursor pool percentages.
        </p>
      </div>
      <div id="resetCards"></div>
      <div class="card">
        <div class="card-head"><h2>Buzzer</h2></div>
        <div class="row-actions flush">
          <button class="chip" id="btnTestBuzz">Test buzz</button>
          <button class="chip" id="btnOpenConfig">Edit schedule JSON</button>
        </div>
        <p class="tile-note gap-above" id="resetConfigPath"></p>
      </div>
    </section>

  </main>

  <footer class="statusbar">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">Starting…</span>
    <span class="spacer"></span>
    <span id="statusEvents"></span>
  </footer>

</div>

<div class="banner" id="banner" role="status" aria-live="polite"></div>
<div class="tooltip" id="tooltip" role="tooltip"></div>

<script src="app.js"></script>
</body>
</html>
